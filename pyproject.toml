[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartha-principal-miner"
version = "0.1.0"
description = "Principal miner rewards backend for Cartha federated miners"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    "eth-account>=0.13",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
bt = [
    "bittensor>=9.0",
]
gcp = [
    "google-cloud-secret-manager>=2.21",
]
all = [
    "bittensor>=9.0",
    "google-cloud-secret-manager>=2.21",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]
