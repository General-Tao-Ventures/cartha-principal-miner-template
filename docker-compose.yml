services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: principal_rewards
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8100:8100"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/principal_rewards
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100

  epoch-monitor:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/principal_rewards
    command: python -m app.jobs.epoch_monitor

volumes:
  pgdata:
